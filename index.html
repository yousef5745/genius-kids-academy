  SEC.forEach(function(x){var st=stat(x.id),ac2=st.ok+st.bad?Math.round(st.ok/(st.ok+st.bad)*100):0,ss=secStars(x.id);h+='<div class="report"><h3>'+x.ico+' '+tr(x.id)+'</h3><div class="barline">⭐ '+ss+'/'+x.n*3+'<span class="b"><i style="width:'+Math.round(ss/(x.n*3)*100)+'%"></i></span></div><div class="barline">🎯 '+tr('accuracy')+' '+ac2+'%<span class="b"><i style="width:'+ac2+'%"></i></span></div><div class="barline">▶ '+tr('played')+': '+st.plays+'</div></div>';});
  var d=new Date(),days=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();h+='<div class="report"><h3>📅 '+tr('calendar')+'</h3><div class="cal">';for(var k=1;k<=days;k++){var dk=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+k;h+='<div class="d'+(S.daily[dk]?' done':'')+(k===d.getDate()?' today':'')+'">'+(S.daily[dk]?'🏆':k)+'</div>';}h+='</div></div><div class="rowbtns"><button class="btn s" data-a="reset">'+tr('reset')+'</button></div>';}
 $('scr').innerHTML=h;$('scr').scrollTop=0;}
